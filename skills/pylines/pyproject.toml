[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "I", "PL", "E501",
    "ANN001", "ANN002", "ANN003",
    "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
]
ignore = [
    "FA",
    "PLR0913", "PLR0917", "PLR2004", "PLR2044",
    "PLR5501", "PLW1641", "PLW2901",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ty.analysis]
strict-equality-semantics = true

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
unsound-return-statement = "error"
redundant-cast = "error"
unused-type-ignore-comment = "error"
